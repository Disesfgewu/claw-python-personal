# config/default.yaml

gateway:
  host: "127.0.0.1"
  port: 18790
  auth_token: ""           # WebSocket 連線需要帶的 token（空 = 不驗證）

llm_router:
  url: "http://127.0.0.1:8000"
  api_key: ""              # 從 .env 覆蓋

agents:
  default:
    system_prompt: null    # null = 用 DEFAULT_SYSTEM_PROMPT
    queue_mode: "collect"  # collect | followup | drop
    sandbox: false         # main agent 預設不 sandbox
    max_tool_rounds: 8
    prompt_tools: true     # 使用 prompt-based tool calling fallback

sandbox:
  enabled: true
  image: "claw-sandbox:latest"
  workspace_dir: "/workspace"
  timeout: 60              # container 最長存活秒數
  memory_limit: "256m"
  cpu_period: 100000
  cpu_quota: 50000         # 50% CPU

skills:
  dir: "skills"            # 相對於專案根目錄
  autoload: true

storage:
  db_path: "~/.claw/claw.db"
  transcript_dir: "~/.claw/transcripts"

logging:
  level: "INFO"            # DEBUG | INFO | WARNING | ERROR
  format: "json"           # json | text

mcp:
  servers: []
  # 範例（取消註解以啟用）：
  # - name: filesystem
  #   transport: stdio
  #   command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
  #   enabled: true
  # - name: my-sse-server
  #   transport: sse
  #   url: "http://localhost:3001"
  #   enabled: true

discord:
  enabled: true
  token: ""
  # Set DISCORD_TOKEN env var or token here
  # Cron jobs 用的 channel IDs（可選）
  stock_channel_id: 1481087192783913174       # 股票分析頻道
  morning_report_channel_id: 1481087192783913174  # 晨報頻道（可選，沒設就用 stock_channel_id）
  intent_model: "gemma3:27b"  # Model used for intent pre-classification and AI opinion generation
